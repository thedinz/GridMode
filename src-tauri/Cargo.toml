[package]
name = "gridmode"
version = "1.0.0"
description = "GridMode is a desktop photo viewer built around your folders, EXIF dates, and fast visual wandering."
authors = ["thedinz"]
license = "MIT"
repository = "https://github.com/thedinz/GridMode"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "gridmode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
getrandom = "0.2"
image = { version = "0.24.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
log = "0.4"
notify-debouncer-mini = "0.7.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.10.1"
ts-rs = { version = "10.1.0", features = ["no-serde-warnings"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation"] }
