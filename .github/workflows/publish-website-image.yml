name: Publish private website image

on:
  push:
    branches:
      - website
    paths:
      - website/**
      - .dockerignore
      - compose.yaml
      - compose.production.yaml
      - .github/workflows/publish-website-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-gridmode-website
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/thedinz/gridmode-website

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Require the private registry token
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "Add the GHCR_TOKEN repository secret before publishing."
            exit 1
          fi

      - name: Check out the website branch
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: thedinz
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and publish the website
        uses: docker/build-push-action@v6
        with:
          context: .
          file: website/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
