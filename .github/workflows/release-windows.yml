name: Release Desktop

# Releases are deliberate: push a version tag (git tag v0.1.31 && git push origin v0.1.31)
# or run this workflow manually with a version. Every published release reaches
# existing users through the auto-updater, so pushes to main no longer release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 0.1.31)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  windows:
    name: Build and publish Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version '$version' is not major.minor.patch."
            exit 1
          fi
          echo "GRIDMODE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test before releasing
        run: |
          pnpm typecheck
          pnpm test
          pnpm test:rust

      - name: Stamp release version
        shell: pwsh
        run: pnpm stamp-version $env:GRIDMODE_VERSION

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm release:win

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:GRIDMODE_VERSION"
          gh release view $tag --repo thedinz/GridMode
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "GridMode $env:GRIDMODE_VERSION" --notes "GridMode $env:GRIDMODE_VERSION" --target $env:GITHUB_SHA --repo thedinz/GridMode --draft
          }

      - name: Upload Windows installer and signature
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:GRIDMODE_VERSION"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "No Tauri NSIS installer was produced."
          }
          $signature = Get-Item "$($installer.FullName).sig"
          gh release upload $tag $installer.FullName $signature.FullName --clobber --repo thedinz/GridMode

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridMode-windows-tauri
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  mac:
    name: Build and publish Mac download
    runs-on: macos-15-intel
    needs: windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        run: echo "GRIDMODE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp release version
        run: pnpm stamp-version "$GRIDMODE_VERSION"

      - name: Build unsigned universal Mac download
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm dist:mac

      - name: Verify universal Mac executable
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo "Expected exactly one Mac app bundle, found ${#apps[@]}." >&2
            exit 1
          fi

          executables=("${apps[0]}"/Contents/MacOS/*)
          app_executable=""
          for candidate in "${executables[@]}"; do
            if [[ -f "$candidate" && -x "$candidate" ]]; then
              app_executable="$candidate"
              break
            fi
          done
          if [[ -z "$app_executable" ]]; then
            echo "No executable found in ${apps[0]}/Contents/MacOS." >&2
            exit 1
          fi

          architectures="$(lipo -archs "$app_executable")"
          for required_architecture in x86_64 arm64; do
            if [[ " $architectures " != *" $required_architecture "* ]]; then
              echo "Missing $required_architecture slice in $app_executable ($architectures)." >&2
              exit 1
            fi
          done
          echo "Verified universal executable: $architectures"

      - name: Upload Mac DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${GRIDMODE_VERSION}" src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig --clobber --repo thedinz/GridMode

      - name: Download Windows updater artifact
        uses: actions/download-artifact@v4
        with:
          name: GridMode-windows-tauri
          path: release-artifacts/windows

      - name: Upload Tauri updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/create-tauri-updater-json.mjs "$GRIDMODE_VERSION" "$PWD/latest.json" "$PWD/release-artifacts/windows" "$PWD/src-tauri/target/universal-apple-darwin/release/bundle/macos"
          gh release upload "v${GRIDMODE_VERSION}" "$PWD/latest.json" --clobber --repo thedinz/GridMode
          gh release edit "v${GRIDMODE_VERSION}" --draft=false --latest --repo thedinz/GridMode

      - name: Upload Mac workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridMode-mac-universal-unsigned
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            latest.json
          if-no-files-found: error
